[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/'
]

[lint]
severity = ["high", "med"]
exclude_lints = ["unsafe-typecast"]   # all bytes32("...") casts in tests use short strings

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
